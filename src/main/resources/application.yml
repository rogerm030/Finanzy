server:
  port: ${PORT:8080}

spring:
  application:
    name: Finanzy
  datasource:
    url: jdbc:h2:file:./data/finanzy-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

finanzy:
  jwt:
    # 256-bit base64 secret key for offline-ready long-lived JWT tokens
    secret: RmluYW56eVN1cGVyU2VjcmV0S2V5Rm9yT2ZmbGluZUZpcnN0UFdBIn2026JwtSigningKey998877665544332211==
    # 30 days expiration in milliseconds (allows prolonged offline usage)
    expiration-ms: 2592000000
